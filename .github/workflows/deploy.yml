# Deploy: SPEC.md 7.8. Runs when a version tag is pushed and on manual dispatch.
# The job runs only when the repository variable DEPLOY_PAGES is 'true', which the owner sets
# after enabling GitHub Pages; until then it is skipped and nothing fails.
# The site is built here with RELEASE=1 (a release build) and published with the GitHub Pages
# actions; GITHUB_REPOSITORY, set by Actions, gives site and base (SPEC.md 7.2 item 10).
# The two release archives of SPEC.md 7.8 are built by GATE at releases 0.5 and 1.0.
name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Release build
        run: npm run build
        env:
          RELEASE: '1'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
